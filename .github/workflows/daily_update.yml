name: Daily Stock Data Update

on:
  schedule:
    - cron: '30 7 * * *'   # 매일 한국시간 16:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install finance-datareader pandas openpyxl

      - name: Run update script
        run: python update_kp30kd10.py

      - name: Check data folder
        run: |
          echo "=== 현재 폴더 구조 ==="
          ls -la
          echo "=== data 폴더 내용 ==="
          ls -la data/ || echo "data 폴더 없음"

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -d "data" ]; then
            git add data/
            git status
            git commit -m "Update stock data $(date +'%Y-%m-%d')" || echo "No changes to commit"
            git push
          else
            echo "data 폴더가 생성되지 않았습니다."
            exit 1
          fi
